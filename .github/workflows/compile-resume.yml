name: Compile Resume

on:
  push:
    paths-ignore:
      - '*.pdf'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Tyler_Ryan_Resume.tex

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Tyler_Ryan_Resume.pdf
          git diff --cached --quiet || git commit -m "chore: update compiled resume PDF"
          git push
